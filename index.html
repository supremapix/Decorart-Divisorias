
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decorart Divisórias | Drywall e Forros em Curitiba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #ffffff; }
      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        10%, 30% { transform: scale(0.9); }
        20%, 40% { transform: scale(1.1); }
      }
      .heart-beat {
        display: inline-block;
        animation: heartBeat 1.3s ease-in-out infinite;
      }
      .typewriter-cursor::after {
        content: '|';
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        from, to { color: transparent }
        50% { color: inherit }
      }
      .scrolling-touch {
        -webkit-overflow-scrolling: touch;
      }
      /* Custom Gold color from image */
      .text-gold { color: #9C7C13; }
      .bg-gold { background-color: #9C7C13; }
      .border-gold { border-color: #9C7C13; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/": "https://esm.sh/react@18.3.1/",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/": "https://esm.sh/react-dom@18.3.1/",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.475.0?deps=react@18.3.1",
        "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.3.1",
        "react-helmet-async": "https://esm.sh/react-helmet-async@2.0.5?deps=react@18.3.1",
        "framer-motion": "https://esm.sh/framer-motion@11.0.8?deps=react@18.3.1"
      }
    }
    </script>
  </head>
  <body class="bg-white text-gray-900">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
